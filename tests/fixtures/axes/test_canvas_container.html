<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Canvas Container Probe</title></head>
<body>
  <h1>Canvas Container Probe</h1>
  <div id="status">Running...</div>
  <script>
    async function sha256Hex(bufferOrString) {
      let data;
      if (typeof bufferOrString === "string") {
        data = new TextEncoder().encode(bufferOrString);
      } else if (bufferOrString instanceof ArrayBuffer) {
        data = new Uint8Array(bufferOrString);
      } else if (bufferOrString.buffer instanceof ArrayBuffer) {
        data = new Uint8Array(bufferOrString.buffer, bufferOrString.byteOffset, bufferOrString.byteLength);
      } else {
        data = new Uint8Array(bufferOrString);
      }
      const hashBuf = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    async function run() {
      const c = document.createElement("canvas");
      c.width = 240;
      c.height = 60;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#f60";
      ctx.fillRect(10, 10, 80, 40);
      ctx.fillStyle = "#069";
      ctx.font = "16px sans-serif";
      ctx.fillText("Aegis Container Test", 15, 35);

      const dataUrl = c.toDataURL();
      const imgData = ctx.getImageData(0, 0, 240, 60).data;
      const hDataUrl = await sha256Hex(dataUrl);
      const hImgData = await sha256Hex(imgData);

      const params = new URLSearchParams(location.search);
      const cid = params.get("cid") || "unknown";

      const payload = {
        cid: cid,
        dataUrlHash: hDataUrl,
        imgDataHash: hImgData
      };

      document.getElementById("status").textContent = JSON.stringify(payload);

      await fetch("/api/report_fp?cid=" + encodeURIComponent(cid), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
    }

    run();
  </script>
</body>
</html>
