<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Aegis S3 Surface Enforcement Test</title>
</head>
<body>
  <h1>Aegis S3 Verification Probe</h1>
  <div id="results"></div>

  <script>
    const report = {};

    // 1. WebGL Check
    try {
      const canvas = document.createElement("canvas");
      const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
      report.webgl_null = (gl === null);
    } catch (e) {
      report.webgl_null = true;
      report.webgl_error = e.toString();
    }

    // 2. WebAssembly Check
    try {
      if (typeof WebAssembly === "undefined") {
        report.wasm_disabled = true;
        report.wasm_detail = "WebAssembly is undefined";
      } else {
        // Test minimal 8-byte wasm module header: \0asm\1\0\0\0
        const bytes = new Uint8Array([0x00, 0x61, 0x73, 0x6d, 0x01, 0x00, 0x00, 0x00]);
        const valid = WebAssembly.validate(bytes);
        report.wasm_disabled = !valid;
        report.wasm_detail = "validate() = " + valid;
      }
    } catch (e) {
      report.wasm_disabled = true;
      report.wasm_detail = "threw: " + e.message;
    }

    // 3. JIT Microbenchmark Timing with Median over 5 runs
    // Arithmetic loop where Baseline/Ion JIT compiles in ~5-15ms,
    // while pure bytecode interpreter takes ~80-150ms.
    function fib(n) {
      let a = 0, b = 1;
      for (let i = 0; i < n; i++) {
        let t = a + b;
        a = b;
        b = (t % 1000000);
      }
      return a;
    }

    function runIteration() {
      const t0 = performance.now();
      let sum = 0;
      for (let k = 0; k < 20000; k++) {
        sum += fib(200);
      }
      return { duration: performance.now() - t0, sum };
    }

    const runs = [];
    let checkSum = 0;
    for (let r = 0; r < 5; r++) {
      const it = runIteration();
      runs.push(it.duration);
      checkSum = it.sum;
    }

    // Compute median
    runs.sort((a, b) => a - b);
    const medianMs = Math.round(runs[2]);

    report.jit_bench_median_ms = medianMs;
    report.jit_runs_ms = runs.map(x => Math.round(x));
    report.sum = checkSum;

    console.log("AEGIS_PROBE_RESULT:" + JSON.stringify(report));
    document.getElementById("results").textContent = JSON.stringify(report);

    // Send to local test server if served over HTTP
    if (location.protocol.startsWith("http")) {
      fetch("/api/report", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(report)
      }).catch(() => {});
    }
  </script>
</body>
</html>
