// Aegis Browser - Unified Autoconfig (aegis.cfg)
// Placed in: firefox-esr/aegis.cfg
// Tested environment: Firefox ESR 153.5.1esr (64-bit) on Linux x86_64
//
// Security Design:
// 1. General autoconfig sandbox (general.config.sandbox_enabled) is NOT disabled.
// 2. Surface tier is selected exclusively via AEGIS_SURFACE_TIER or profile tier token.
// 3. FAIL-CLOSED: Any unset, unrecognized, or mismatched tier selection automatically
//    locks down to S4 Minimal/Static (JavaScript disabled, JIT off, WASM off, WebGL off).

// Required comment line for Mozilla autoconfig

// Universal baseline hardening
lockPref("toolkit.telemetry.enabled", false);
lockPref("toolkit.telemetry.unified", false);
lockPref("datareporting.healthreport.uploadEnabled", false);
lockPref("app.shield.optoutstudies.enabled", false);
lockPref("app.normandy.enabled", false);
lockPref("security.mixed_content.block_active_content", true);
lockPref("network.cookie.cookieBehavior", 5);

// Detect environment tier
var envTier = "";
try {
  if (typeof getenv === "function") {
    envTier = getenv("AEGIS_SURFACE_TIER");
  }
} catch (e1) {}

// Detect profile tier file if present
var profTier = "";
try {
  if (typeof Services !== "undefined" && Services.dirsvc) {
    var profDir = Services.dirsvc.get("ProfD", Components.interfaces.nsIFile);
    var tierFile = profDir.clone();
    tierFile.append("aegis-surface-tier.txt");
    if (tierFile.exists()) {
      var fstream = Components.classes["@mozilla.org/network/file-input-stream;1"].createInstance(Components.interfaces.nsIFileInputStream);
      fstream.init(tierFile, -1, 0, 0);
      var cstream = Components.classes["@mozilla.org/intl/converter-input-stream;1"].createInstance(Components.interfaces.nsIConverterInputStream);
      cstream.init(fstream, "UTF-8", 0, 0);
      var str = {};
      cstream.readString(-1, str);
      cstream.close();
      profTier = str.value.trim();
    }
  }
} catch (e2) {}

// Resolve tier with fail-closed validation
var activeTier = "S4"; // Default fail-closed target
var isFailClosed = false;
var failReason = "";

var candidateTier = envTier || profTier;

if (!candidateTier) {
  isFailClosed = true;
  failReason = "Unset AEGIS_SURFACE_TIER and no profile tier file";
} else if (candidateTier !== "S1" && candidateTier !== "S2" && candidateTier !== "S3" && candidateTier !== "S4") {
  isFailClosed = true;
  failReason = "Invalid tier value: " + candidateTier;
} else if (envTier && profTier && envTier !== profTier) {
  isFailClosed = true;
  failReason = "Tier mismatch: env (" + envTier + ") != profile (" + profTier + ")";
} else {
  activeTier = candidateTier;
}

if (isFailClosed) {
  activeTier = "S4";
  try {
    if (typeof Services !== "undefined" && Services.console) {
      Services.console.logStringMessage("AEGIS_SECURITY_ALERT: " + failReason + " - Failing closed to S4 minimal surface");
    }
  } catch (e3) {}
}

defaultPref("aegis.surface.active_tier", activeTier);
defaultPref("aegis.surface.fail_closed", isFailClosed);

// Apply Tier Controls
if (activeTier === "S1") {
  // S1 Standard
  defaultPref("dom.security.https_only_mode", false);
  defaultPref("media.autoplay.default", 0);
  defaultPref("javascript.options.baselinejit", true);
  defaultPref("javascript.options.ion", true);
  defaultPref("javascript.options.wasm", true);
  defaultPref("webgl.disabled", false);
  defaultPref("gfx.downloadable_fonts.enabled", true);
  defaultPref("javascript.enabled", true);
} else if (activeTier === "S2") {
  // S2 Guarded
  lockPref("dom.security.https_only_mode", true);
  lockPref("media.autoplay.default", 1);
  lockPref("media.peerconnection.ice.default_address_only", true);
  defaultPref("javascript.options.baselinejit", true);
  defaultPref("javascript.options.ion", true);
  defaultPref("javascript.options.wasm", true);
  defaultPref("webgl.disabled", false);
  defaultPref("gfx.downloadable_fonts.enabled", true);
  defaultPref("javascript.enabled", true);
} else if (activeTier === "S3") {
  // S3 Strict
  lockPref("dom.security.https_only_mode", true);
  lockPref("media.autoplay.default", 5);
  lockPref("javascript.options.baselinejit", false);
  lockPref("javascript.options.ion", false);
  lockPref("javascript.options.wasm", false);
  lockPref("webgl.disabled", true);
  lockPref("mathml.disabled", true);
  lockPref("gfx.font_rendering.opentype_svg.enabled", false);
  defaultPref("gfx.downloadable_fonts.enabled", true);
  defaultPref("javascript.enabled", true);
} else {
  // S4 Static / Fail-Closed
  lockPref("dom.security.https_only_mode", true);
  lockPref("javascript.enabled", false);
  lockPref("javascript.options.baselinejit", false);
  lockPref("javascript.options.ion", false);
  lockPref("javascript.options.wasm", false);
  lockPref("webgl.disabled", true);
  lockPref("mathml.disabled", true);
  lockPref("gfx.font_rendering.opentype_svg.enabled", false);
  lockPref("gfx.downloadable_fonts.enabled", false);
  lockPref("media.peerconnection.enabled", false);
}
