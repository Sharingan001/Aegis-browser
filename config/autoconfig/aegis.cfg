// Aegis Browser - Default autoconfig (aegis.cfg)
// Placed in: firefox-esr/aegis.cfg
//
// The default build does NOT lock JIT/WASM off.
// Strict S3 controls are isolated to named test fixtures (see s3-fixture.cfg).

// Required initial comment line for Mozilla autoconfig

// Disable telemetry
lockPref("toolkit.telemetry.enabled", false);
lockPref("toolkit.telemetry.unified", false);
lockPref("datareporting.healthreport.uploadEnabled", false);

// Disable Mozilla studies and experiments
lockPref("app.shield.optoutstudies.enabled", false);
lockPref("app.normandy.enabled", false);
