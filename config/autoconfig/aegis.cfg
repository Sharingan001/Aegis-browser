// Aegis Browser - aegis.cfg
// Placed in: firefox-esr/aegis.cfg  (application directory root)
//
// VERIFY-S-021: verify this mechanism and syntax work in ESR 153.
// This file sets preferences that enterprise policies.json cannot set.
// It is loaded by autoconfig.js.
//
// Syntax: lockPref(), defaultPref(), or pref()
//   lockPref()    - user cannot change; about:config shows locked
//   defaultPref() - user can override; set as default only
//   pref()        - applied once at startup; user can still change
//
// WARNING: All pref names below are UNVERIFIED against ESR 153 until tested.
// Check each against about:config in a live ESR 153 instance before trusting.
// See docs/VERIFY.md for verification status.

// The first line MUST be a comment (not a pref call) per autoconfig rules.
// This line is that required comment.

// -- Phase 0 fast-path prefs ------------------------------------------------

// Disable telemetry (belt-and-suspenders alongside policies.json)
lockPref("toolkit.telemetry.enabled", false);
lockPref("toolkit.telemetry.unified", false);
lockPref("datareporting.healthreport.uploadEnabled", false);

// Disable Mozilla studies and experiments
lockPref("app.shield.optoutstudies.enabled", false);
lockPref("app.normandy.enabled", false);

// JIT compilers disabled (S3/S4 controls - VERIFY-S-007, VERIFY-S-008)
lockPref("javascript.options.baselinejit", false);
lockPref("javascript.options.ion", false);

// WebAssembly disabled (S3/S4 control - VERIFY-S-009)
lockPref("javascript.options.wasm", false);

