// Aegis S3 Named Fixture - s3-fixture.cfg
// Placed in: firefox-esr/aegis.cfg when testing the S3 surface fixture
//
// Locks JIT compilers and WebAssembly OFF for S3 testing.

// Required initial comment line for Mozilla autoconfig

// Disable telemetry
lockPref("toolkit.telemetry.enabled", false);
lockPref("toolkit.telemetry.unified", false);
lockPref("datareporting.healthreport.uploadEnabled", false);

// Disable studies
lockPref("app.shield.optoutstudies.enabled", false);
lockPref("app.normandy.enabled", false);

// S3 Controls: JIT compilers disabled (VERIFY-S-007, VERIFY-S-008)
lockPref("javascript.options.baselinejit", false);
lockPref("javascript.options.ion", false);

// S3 Control: WebAssembly disabled (VERIFY-S-009)
lockPref("javascript.options.wasm", false);
